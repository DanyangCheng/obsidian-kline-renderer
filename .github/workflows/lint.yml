name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v3
            
            - name: Use Node.js
                uses: actions/setup-node@v3
                with:
                node-version: '20.x'
                
            - name: Install dependencies
                run: npm ci
                
            - name: Build plugin
                run: npm run build

